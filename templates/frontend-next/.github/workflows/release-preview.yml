name: Release Preview

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    uses: Jabbcode/release-toolkit/.github/workflows/release-preview-next.yml@v1.1.0
    with:
      code_paths_regex: '^(src/|prisma/|next\.config\.ts$|package\.json$|pnpm-lock\.yaml$|tsconfig\.json$|vercel\.json$)'
      toolkit_ref: v1.1.0
    secrets: inherit
