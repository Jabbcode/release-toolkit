name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: Jabbcode/release-toolkit/.github/workflows/release-next.yml@v1.1.0
    with:
      code_paths_regex: '^(src/|prisma/|next\.config\.ts$|package\.json$|pnpm-lock\.yaml$|tsconfig\.json$|vercel\.json$)'
      toolkit_ref: v1.1.0
    secrets: inherit
