name: Deploy Version (manual)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  deploy:
    uses: Jabbcode/release-toolkit/.github/workflows/deploy-vercel-next.yml@v1.1.3
    with:
      toolkit_ref: v1.1.3
      toolkit_repository: Jabbcode/release-toolkit
    secrets: inherit
