name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    uses: Jabbcode/release-toolkit/.github/workflows/release.yml@v1.0.0
    with:
      # Rutas cuyo cambio cuenta como "cambio de código" versionable en este
      # repo. Ajusta segun tu estructura real.
      code_paths_regex: '^(src/|package\.json$|package-lock\.json$|tsconfig.*\.json$|vite\.config\.ts$|vercel\.json$|index\.html$)'
      # Sin base de datos en el frontend: no se pasa db_paths_regex.
      toolkit_ref: v1.0.0
    secrets: inherit
